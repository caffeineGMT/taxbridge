name: Deploy to GitHub Pages Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Allow only one concurrent deployment
concurrency:
  group: "gh-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Temporarily move API routes (not supported in static export)
        run: |
          if [ -d "app/api" ]; then
            mv app/api app/api.bak
            echo "📁 Temporarily moved app/api to app/api.bak for static build"
          fi

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          # Next.js will use static export mode
          # basePath will be /cross-border-tax
        run: npm run build

      - name: Restore API routes
        if: always()
        run: |
          if [ -d "app/api.bak" ]; then
            mv app/api.bak app/api
            echo "📁 Restored app/api directory"
          fi

      - name: Add .nojekyll file
        run: touch out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          cname: false # Set to your custom domain if you have one

      - name: Output Preview URL
        run: |
          echo "🚀 Staging deployment complete!"
          echo "Preview URL: https://caffeinegmt.github.io/cross-border-tax/"

<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- TaxBridge Favicon - Calculator Icon with Gradient -->
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#favicon-gradient)"/>

  <!-- Calculator Icon (simplified) -->
  <rect x="160" y="128" width="192" height="256" rx="16" fill="white" opacity="0.2"/>
  <rect x="160" y="128" width="192" height="256" rx="16" stroke="white" stroke-width="8" fill="none"/>

  <!-- Display -->
  <rect x="184" y="152" width="144" height="48" rx="8" fill="white"/>

  <!-- Buttons (3x3 grid) -->
  <circle cx="208" cy="248" r="16" fill="white" opacity="0.9"/>
  <circle cx="256" cy="248" r="16" fill="white" opacity="0.9"/>
  <circle cx="304" cy="248" r="16" fill="white" opacity="0.9"/>

  <circle cx="208" cy="296" r="16" fill="white" opacity="0.9"/>
  <circle cx="256" cy="296" r="16" fill="white" opacity="0.9"/>
  <circle cx="304" cy="296" r="16" fill="white" opacity="0.9"/>

  <circle cx="208" cy="344" r="16" fill="white" opacity="0.9"/>
  <circle cx="256" cy="344" r="16" fill="white" opacity="0.9"/>
  <circle cx="304" cy="344" r="16" fill="white" opacity="0.9"/>
</svg>

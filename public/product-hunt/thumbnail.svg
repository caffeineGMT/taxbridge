<!-- Product Hunt Thumbnail - 240x240px -->
<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="240" height="240" fill="url(#gradient)" rx="24"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="240" y2="240">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Tax Bridge icon - simplified bridge/connection -->
  <g transform="translate(60, 60)">
    <!-- Left pillar (US flag colors) -->
    <rect x="0" y="40" width="20" height="60" fill="#3b82f6" rx="4"/>

    <!-- Right pillar (Canada flag colors) -->
    <rect x="100" y="40" width="20" height="60" fill="#ef4444" rx="4"/>

    <!-- Bridge arc -->
    <path
      d="M 10 40 Q 60 10 110 40"
      stroke="#22c55e"
      stroke-width="12"
      fill="none"
      stroke-linecap="round"
    />

    <!-- Dollar sign -->
    <text
      x="60"
      y="35"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#fbbf24"
      text-anchor="middle"
    >$</text>
  </g>

  <!-- Brand name -->
  <text
    x="120"
    y="180"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="28"
    font-weight="700"
    fill="white"
    text-anchor="middle"
  >TaxBridge</text>

  <!-- Tagline -->
  <text
    x="120"
    y="205"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="13"
    fill="#94a3b8"
    text-anchor="middle"
  >Cross-Border Tax</text>
</svg>
